  <!-- 远处飞鸟剪影 -->
  <g fill="none" stroke="#6b7d6a" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <path d="M300 120 q8 -7 16 0 q8 -7 16 0"/>
    <path d="M356 140 q6 -5 12 0 q6 -5 12 0"/>
    <path d="M980 96 q7 -6 14 0 q7 -6 14 0"/>
